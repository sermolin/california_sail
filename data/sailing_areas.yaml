# Sailing regions with zones.
# Phase 2: 3-4 zones per region. flood_dir_deg added for wind-against-tide scoring.
#
# flood_dir_deg: direction (degrees, TO) the current flows during a FLOOD tide
#                (water rising). Ebb = flood_dir_deg + 180.
#                null for regions without significant tidal currents (e.g. Sardinia).
#
# tide_station_id: NOAA CO-OPS water-level station id (US only, null for non-US)
# nws_zone:        NOAA NWS marine zone id (US only, null for non-US)

- id: sf-bay
  name: San Francisco Bay
  country: US
  timezone: America/Los_Angeles
  tide_station_id: "9414290"   # San Francisco (MLLW datum)
  nws_zone: PZZ545
  zones:
    - id: city-front
      name: City Front
      latitude: 37.808
      longitude: -122.435
      exposure: open
      flood_dir_deg: 55       # ENE — flood current flows into the bay
      hazards:
        - shipping traffic
        - strong tidal current
        - afternoon fog

    - id: berkeley-oc
      name: Berkeley Olympic Circle
      latitude: 37.866
      longitude: -122.318
      exposure: open
      flood_dir_deg: 90       # E — current broadly eastward on flood
      hazards:
        - short-period chop
        - kite surfer traffic

    - id: raccoon-strait
      name: Raccoon Strait
      latitude: 37.873
      longitude: -122.460
      exposure: channel
      flood_dir_deg: 65       # ENE — strong channelled flood current
      hazards:
        - very strong tidal current (3+ kt)
        - wind shadow from Angel Island
        - boat traffic

    - id: south-bay
      name: South Bay / Coyote Pt
      latitude: 37.594
      longitude: -122.319
      exposure: sheltered
      flood_dir_deg: 160      # SSE — flood flows south into South Bay
      hazards:
        - shallow water
        - light and variable wind

    - id: richmond-ybc
      name: Richmond / Point Richmond
      latitude: 37.913
      longitude: -122.378
      exposure: open
      flood_dir_deg: 75       # ENE — flood into Central/North Bay
      hazards:
        - strong ebb/flood at Point Richmond
        - refinery tanker traffic
        - afternoon sea breeze

    - id: treasure-island
      name: Treasure Island / Central Bay
      latitude: 37.825
      longitude: -122.371
      exposure: open
      flood_dir_deg: 85       # E — central bay flood
      hazards:
        - wind shadow from Yerba Buena Island
        - ferry and ship traffic
        - confused chop on ebb vs westerly

    - id: sausalito
      name: Sausalito / Richardson Bay
      latitude: 37.859
      longitude: -122.485
      exposure: sheltered
      flood_dir_deg: 70       # ENE — flood into the bay past Raccoon Strait
      hazards:
        - afternoon westerly funneling
        - strong currents near Golden Gate
        - crowded mooring field

    - id: alameda-estuary
      name: Alameda / Oakland Estuary
      latitude: 37.773
      longitude: -122.276
      exposure: sheltered
      flood_dir_deg: 135      # SE — flood into Oakland Estuary
      hazards:
        - container ship traffic (Port of Oakland)
        - narrow channel and powerboat wash
        - light wind in estuary

- id: puget-sound
  name: Puget Sound (Seattle)
  country: US
  timezone: America/Los_Angeles
  tide_station_id: "9447130"   # Seattle
  nws_zone: PZZ135
  zones:
    - id: shilshole
      name: Shilshole Bay
      latitude: 47.688
      longitude: -122.407
      exposure: open
      flood_dir_deg: 165      # SSE — flood into Puget Sound from Strait of Juan de Fuca
      hazards:
        - ferry traffic
        - tidal currents
        - variable wind

    - id: port-townsend
      name: Port Townsend
      latitude: 48.113
      longitude: -122.759
      exposure: open
      flood_dir_deg: 155      # SSE — Admiralty Inlet flood
      hazards:
        - strong tidal currents (Admiralty Inlet)
        - shipping lane
        - fog

    - id: elliott-bay
      name: Elliott Bay (Seattle)
      latitude: 47.607
      longitude: -122.341
      exposure: open
      flood_dir_deg: 170      # S — flood into Elliott Bay
      hazards:
        - ferry traffic (busy)
        - container ship traffic
        - powerboat wash

    - id: possession-sound
      name: Possession Sound
      latitude: 47.995
      longitude: -122.278
      exposure: open
      flood_dir_deg: 150      # SSE — flood southward into Possession Sound
      hazards:
        - tidal rips
        - variable wind

    - id: bainbridge
      name: Bainbridge Island / Eagle Harbor
      latitude: 47.622
      longitude: -122.515
      exposure: sheltered
      flood_dir_deg: 165      # SSE — flood into Central Sound
      hazards:
        - ferry wakes (Seattle–Bainbridge)
        - light wind in lee of island
        - tidal rips off Blakely Rock

    - id: gig-harbor
      name: Gig Harbor
      latitude: 47.327
      longitude: -122.583
      exposure: sheltered
      flood_dir_deg: 155      # SSE — flood into South Sound
      hazards:
        - narrow harbor entrance
        - light wind in harbor
        - Tacoma Narrows current influence

    - id: des-moines
      name: Des Moines / Three Tree Point
      latitude: 47.403
      longitude: -122.339
      exposure: open
      flood_dir_deg: 170      # S — flood into South Central Sound
      hazards:
        - ferry traffic to Vashon
        - steep chop on southerly
        - strong currents near Tacoma Narrows

- id: sardinia
  name: Sardinia
  country: IT
  timezone: Europe/Rome
  tide_station_id: null
  nws_zone: null
  zones:
    - id: costa-smeralda
      name: Costa Smeralda
      latitude: 41.082
      longitude: 9.533
      exposure: open
      flood_dir_deg: null     # tidal range < 0.3 m — currents negligible
      hazards:
        - Mistral gusts (can exceed 30 kt with little warning)
        - rocky coastline
        - dense boat traffic in season

    - id: la-maddalena
      name: La Maddalena Archipelago
      latitude: 41.213
      longitude: 9.405
      exposure: sheltered
      flood_dir_deg: null
      hazards:
        - crowded anchorages in peak season
        - marine park anchoring restrictions
        - Libeccio / Grecale gusts between islands

    - id: bonifacio
      name: Bonifacio Strait
      latitude: 41.370
      longitude: 9.150
      exposure: channel
      flood_dir_deg: null
      hazards:
        - strong wind acceleration through strait
        - tide-driven current (up to 2 kt)
        - rocky passages

    - id: gulf-orosei
      name: Gulf of Orosei / Cala Gonone
      latitude: 40.283
      longitude: 9.638
      exposure: sheltered
      flood_dir_deg: null
      hazards:
        - Sirocco swell from SE
        - rocky calanques and shallow spots near shore
        - dense summer boat traffic

    - id: cagliari
      name: Cagliari Gulf
      latitude: 39.182
      longitude: 9.122
      exposure: open
      flood_dir_deg: null
      hazards:
        - Sirocco swell from SE
        - shallow Gulf of Cagliari

    - id: alghero
      name: Alghero
      latitude: 40.570
      longitude: 8.316
      exposure: open
      flood_dir_deg: null
      hazards:
        - Mistral swell from NW
        - anchoring restrictions near marine park

    - id: stintino
      name: Stintino / Asinara
      latitude: 40.935
      longitude: 8.228
      exposure: open
      flood_dir_deg: null
      hazards:
        - Mistral swell and gusts from NW
        - Asinara marine park anchoring limits
        - shallow La Pelosa approaches

    - id: villasimius
      name: Villasimius / Capo Carbonara
      latitude: 39.144
      longitude: 9.519
      exposure: open
      flood_dir_deg: null
      hazards:
        - Capo Carbonara marine park restrictions
        - Mistral chop when wind veers W
        - crowded anchorages in August

    - id: carloforte
      name: Carloforte / Isola di San Pietro
      latitude: 39.149
      longitude: 8.307
      exposure: open
      flood_dir_deg: null
      hazards:
        - strong Mistral in Strait of Sardinia
        - rocky lee shores on San Pietro
        - limited shelter from NW swell
